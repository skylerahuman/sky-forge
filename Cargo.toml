[workspace]
members = ["crates/*"]
resolver = "2"


[workspace.package]
version = "0.1.0"
rust-version = "1.94"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
crossterm = "0.29.0"
pretty_assertions = "1.4.1"
ratatui = "0.30.0"
reqwest = { version = "0.12.23", features = [
    "json",
    "rustls-tls",
    "hickory-dns",
    "http2",
], default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
    "process",
    "signal",
    "io-util",
] }
uuid = { version = "1.23.0", features = [
    "v4",
    "fast-rng",
    "serde",
] }

# Internal crates
sky_core = { path = "crates/sky_core" }
sky_engine = { path = "crates/sky_engine" }
sky_interface = { path = "crates/sky_interface" }
sky_ledger = { path = "crates/sky_ledger" }
sky_providers = { path = "crates/sky_providers" }
sky_workspace = { path = "crates/sky_workspace" }
